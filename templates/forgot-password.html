<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — AI Prompt Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        ::selection {
            background: #fed7aa;
            color: #7c2d12;
        }

        body {
            background: linear-gradient(135deg, #fafaf9 0%, #f5f5f4 100%);
            min-height: 100vh;
        }

        .noise::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.4;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .toast-in {
            animation: toastIn 0.3s ease-out forwards;
        }

        .toast-out {
            animation: toastOut 0.3s ease-in forwards;
        }
    </style>
</head>

<body class="font-sans text-stone-900 antialiased flex items-center justify-center p-4 relative overflow-hidden noise">

    <!-- Background Decorations -->
    <div class="absolute top-0 -right-32 w-[40%] h-[40%] rounded-full bg-orange-200/20 blur-3xl"></div>
    <div class="absolute bottom-20 -left-32 w-[40%] h-[40%] rounded-full bg-stone-200/40 blur-3xl"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-2"></div>

    <!-- Main Card -->
    <div class="relative z-10 w-full max-w-md animate-fade-in-up">

        <!-- Step 1: Enter Email -->
        <div id="step-email" class="bg-white/80 backdrop-blur-md border border-stone-200/60 rounded-2xl shadow-xl p-8">

            <div class="text-center mb-6">
                <a href="/" class="inline-flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-stone-900 rounded-lg flex items-center justify-center shadow-md">
                        <iconify-icon icon="lucide:sparkles" class="text-white text-sm"></iconify-icon>
                    </div>
                    <span class="font-semibold text-base tracking-tight">AI Prompt Platform</span>
                </a>

                <h2 class="text-2xl font-semibold tracking-tight text-stone-900">Forgot Password</h2>
                <p class="text-xs text-stone-400 mt-1">Enter your email to verify your account</p>
            </div>

            <!-- Email Error -->
            <div id="email-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600 flex items-center gap-2">
                <iconify-icon icon="lucide:alert-circle" class="text-sm shrink-0"></iconify-icon>
                <span id="email-error-text">Error.</span>
            </div>

            <form onsubmit="handleForgotPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Email Address *</label>
                    <input
                        type="email"
                        id="forgot-email"
                        required
                        placeholder="you@example.com"
                        class="w-full text-sm bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-stone-200 focus:border-stone-400 placeholder-stone-400 transition-all"
                    >
                </div>

                <button
                    type="submit"
                    id="email-check-btn"
                    class="w-full bg-stone-900 hover:bg-stone-800 text-white text-sm font-medium py-2.5 rounded-lg transition-all shadow-md shadow-stone-900/10 flex items-center justify-center gap-2"
                >
                    <iconify-icon icon="lucide:mail" class="text-sm"></iconify-icon>
                    Verify Email
                </button>
            </form>

            <p class="text-xs text-stone-400 text-center mt-6">
                Remember your password?
                <a href="/login" class="text-stone-900 font-medium hover:text-orange-600 transition-colors">Sign in</a>
            </p>
        </div>

        <!-- Step 2: Reset Password -->
        <div id="step-reset" class="hidden bg-white/80 backdrop-blur-md border border-stone-200/60 rounded-2xl shadow-xl p-8">

            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center mx-auto mb-4">
                    <iconify-icon icon="lucide:key-round" class="text-xl text-emerald-500"></iconify-icon>
                </div>

                <h2 class="text-2xl font-semibold tracking-tight text-stone-900">Reset Password</h2>
                <p class="text-xs text-stone-400 mt-1">Enter your new password below</p>
            </div>

            <!-- Reset Error -->
            <div id="reset-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600 flex items-center gap-2">
                <iconify-icon icon="lucide:alert-circle" class="text-sm shrink-0"></iconify-icon>
                <span id="reset-error-text">Error.</span>
            </div>

            <form onsubmit="handleResetPassword(event)" class="space-y-4">
                <input type="hidden" id="reset-email" value="">

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">New Password *</label>
                    <input
                        type="password"
                        id="new-password"
                        required
                        minlength="6"
                        placeholder="Min 6 characters"
                        class="w-full text-sm bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-stone-200 focus:border-stone-400 placeholder-stone-400 transition-all"
                    >
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">Confirm New Password *</label>
                    <input
                        type="password"
                        id="confirm-new-password"
                        required
                        placeholder="Re-enter password"
                        class="w-full text-sm bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-stone-200 focus:border-stone-400 placeholder-stone-400 transition-all"
                    >
                </div>

                <button
                    type="submit"
                    id="reset-btn"
                    class="w-full bg-stone-900 hover:bg-stone-800 text-white text-sm font-medium py-2.5 rounded-lg transition-all shadow-md shadow-stone-900/10 flex items-center justify-center gap-2"
                >
                    <iconify-icon icon="lucide:check" class="text-sm"></iconify-icon>
                    Reset Password
                </button>
            </form>
        </div>

        <p class="text-center text-[10px] text-stone-300 mt-6">DS-Lab Project — SZABIST Islamabad</p>
    </div>

    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();

            const email = document.getElementById('forgot-email').value.trim();
            const errDiv = document.getElementById('email-error');
            const errText = document.getElementById('email-error-text');
            const btn = document.getElementById('email-check-btn');

            errDiv.classList.add('hidden');

            try {
                btn.disabled = true;
                btn.innerHTML = `
                    <iconify-icon icon="lucide:loader-2" class="text-sm animate-spin"></iconify-icon>
                    Checking...
                `;

                const response = await fetch('/api/forgot-password/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                if (data.status !== "success") {
                    errText.textContent = data.message || 'No account found with this email.';
                    errDiv.classList.remove('hidden');

                    btn.disabled = false;
                    btn.innerHTML = `
                        <iconify-icon icon="lucide:mail" class="text-sm"></iconify-icon>
                        Verify Email
                    `;

                    return;
                }

                document.getElementById('step-email').classList.add('hidden');
                document.getElementById('step-reset').classList.remove('hidden');
                document.getElementById('reset-email').value = email;

                showToast('Email verified! Set your new password.', 'lucide:check-circle');

            } catch (error) {
                errText.textContent = 'Server error. Make sure Flask is running.';
                errDiv.classList.remove('hidden');

                btn.disabled = false;
                btn.innerHTML = `
                    <iconify-icon icon="lucide:mail" class="text-sm"></iconify-icon>
                    Verify Email
                `;
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();

            const email = document.getElementById('reset-email').value;
            const newPass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-new-password').value;

            const errDiv = document.getElementById('reset-error');
            const errText = document.getElementById('reset-error-text');
            const btn = document.getElementById('reset-btn');

            errDiv.classList.add('hidden');

            if (newPass !== confirm) {
                errText.textContent = 'Passwords do not match.';
                errDiv.classList.remove('hidden');
                return;
            }

            if (newPass.length < 6) {
                errText.textContent = 'Password must be at least 6 characters.';
                errDiv.classList.remove('hidden');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = `
                    <iconify-icon icon="lucide:loader-2" class="text-sm animate-spin"></iconify-icon>
                    Resetting...
                `;

                const response = await fetch('/api/forgot-password/reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: newPass
                    })
                });

                const data = await response.json();

                if (data.status !== "success") {
                    errText.textContent = data.message || 'Password reset failed.';
                    errDiv.classList.remove('hidden');

                    btn.disabled = false;
                    btn.innerHTML = `
                        <iconify-icon icon="lucide:check" class="text-sm"></iconify-icon>
                        Reset Password
                    `;

                    return;
                }

                showToast('Password reset successfully! Redirecting to sign in...', 'lucide:check-circle');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);

            } catch (error) {
                errText.textContent = 'Server error. Make sure Flask is running.';
                errDiv.classList.remove('hidden');

                btn.disabled = false;
                btn.innerHTML = `
                    <iconify-icon icon="lucide:check" class="text-sm"></iconify-icon>
                    Reset Password
                `;
            }
        }

        function showToast(message, icon = 'lucide:info') {
            const container = document.getElementById('toast-container');

            const toast = document.createElement('div');

            toast.className = 'toast-in flex items-center gap-2.5 bg-white border border-stone-200 shadow-lg rounded-xl px-4 py-3 min-w-[240px] max-w-sm';

            toast.innerHTML = `
                <iconify-icon icon="${icon}" class="text-orange-500 text-base shrink-0"></iconify-icon>
                <span class="text-sm text-stone-700">${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.className = toast.className.replace('toast-in', 'toast-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>

</body>
</html>
